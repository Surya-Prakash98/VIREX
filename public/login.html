<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VIREX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="nav-brand" style="display: flex; align-items: center; gap: 8px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                    <rect x="9" y="9" width="6" height="6"></rect>
                    <line x1="9" y1="1" x2="9" y2="4"></line>
                    <line x1="15" y1="1" x2="15" y2="4"></line>
                    <line x1="9" y1="20" x2="9" y2="23"></line>
                    <line x1="15" y1="20" x2="15" y2="23"></line>
                    <line x1="20" y1="9" x2="23" y2="9"></line>
                    <line x1="20" y1="14" x2="23" y2="14"></line>
                    <line x1="1" y1="9" x2="4" y2="9"></line>
                    <line x1="1" y1="14" x2="4" y2="14"></line>
                </svg>
                VIREX
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Browse</a></li>
                <li><a href="dashboard.html">Request Board</a></li>
                <li style="display: flex; align-items: center; gap: 1rem;"><a href="login.html" class="active">Log In</a><a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-card">
            <h2 style="margin-bottom: 0.5rem;">Log In to VIREX</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Access your dashboard to manage listings & rentals.</p>

            <div id="formAlert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="user@example.com">
                    <span class="error-text" id="emailErr"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="••••••••">
                        <button type="button" class="password-toggle" id="togglePassword">Show</button>
                    </div>
                    <span class="error-text" id="passwordErr"></span>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">Log In</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account? <a href="signup.html" style="color: var(--primary-color); font-weight: 600;">Sign up</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 VIREX Electronics Marketplace. All rights reserved.</p>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
